name: Build Demo AppImage

on:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build assets from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-source-v1 \
            --repo ${{ github.repository }} \
            --pattern "NoblesDemo-Linux.zip" \
            --dir downloads

      - name: Unzip Demo Linux build
        run: |
          mkdir -p extracted
          unzip -q "downloads/NoblesDemo-Linux.zip" -d extracted
          ls -la extracted

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          cp "extracted/Nobles Demo.x86_64" AppDir/usr/bin/NoblesDemo
          chmod +x AppDir/usr/bin/NoblesDemo
          cp -R "extracted/Nobles Demo_Data" AppDir/usr/bin/NoblesDemo_Data
          cp "extracted/UnityPlayer.so" AppDir/usr/bin/ || echo "No separate UnityPlayer.so found, continuing"
          ls -la AppDir/usr/bin

      - name: Install ImageMagick and zip
        run: sudo apt-get update && sudo apt-get install -y imagemagick zip

      - name: Resize and place icon
        run: |
          convert "Builds/Icons/Regal Icon.png" -resize 256x256 AppDir/noblesdemo.png
          ls -la AppDir

      - name: Create desktop entry
        run: |
          cat > AppDir/noblesdemo.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Nobles Demo
          Exec=NoblesDemo
          Icon=noblesdemo
          Categories=Game;
          EOF
          cat AppDir/noblesdemo.desktop

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/noblesdemo.desktop \
            --icon-file AppDir/noblesdemo.png \
            --output appimage

      - name: Rename AppImage
        run: |
          ls -la *.AppImage
          for f in *.AppImage; do
            if [ "$f" != "linuxdeploy-x86_64.AppImage" ]; then
              mv "$f" "Nobles Demo.AppImage"
            fi
          done
          ls -la *.AppImage

      - name: Zip AppImage
        run: |
          mkdir -p dist-zip
          zip -j "dist-zip/NoblesDemo-appimage.zip" "Nobles Demo.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nobles-Demo-AppImage
          path: "dist-zip/NoblesDemo-appimage.zip"
