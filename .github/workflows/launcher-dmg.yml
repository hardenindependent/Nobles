name: Build Launcher DMG

on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check
        run: |
          echo "Runner is alive"
          pwd
          ls -la

      - name: Download build assets from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-source-v1 \
            --repo ${{ github.repository }} \
            --pattern "*.zip" \
            --dir downloads

      - name: List downloaded files
        run: ls -la downloads
